name: Delivery reservation witness

on:
  push:
    branches: [codex/delivery-reservation-linux-witness]

permissions:
  contents: read

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XMD_TEST_ARTIFACTS: ${{ github.workspace }}/.xmd/delivery-witness-journals
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.4"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.9.5
      - run: deno task deps
      - run: deno task build:web
      - run: pnpm install
      - run: pnpm exec tsc --project tsconfig.node.json --noEmit
      - name: Run the direct Node Delivery suite once
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/delivery-witness"
          {
            git rev-parse HEAD
            git hash-object examples/adversarial-implementation/tests/components/Fixture/Fallback.md
            node --version
            deno --version
          } > "$RUNNER_TEMP/delivery-witness/source.txt"
          pnpm exec tsx --tsconfig tsconfig.node.json scripts/delivery-reservation-witness.mts \
            2>&1 | tee "$RUNNER_TEMP/delivery-witness/output.log"
      - name: Retain the first output and journals
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: delivery-reservation-witness-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/delivery-witness
            ${{ env.XMD_TEST_ARTIFACTS }}
          if-no-files-found: ignore
          retention-days: "7"
