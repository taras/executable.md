name: One fallback attribution capture
on:
  push:
    branches: [codex/fallback-attribution-owner-35749f4]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Retain initial envelope before checkout or runtime setup
        run: |
          mkdir -p "$RUNNER_TEMP/fallback-capture/evidence"
          printf '{"schema":"fallback-initial.v1","consumerExecutions":0,"status":"before-checkout-and-setup","envelope":"%s","run":"%s","attempt":"%s","image":"%s","runner":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$ImageVersion" "$RUNNER_NAME" > "$RUNNER_TEMP/fallback-capture/evidence/initial-manifest.json"
          uname -a > "$RUNNER_TEMP/fallback-capture/evidence/initial-uname.txt"
          cat /etc/os-release > "$RUNNER_TEMP/fallback-capture/evidence/initial-os-release.txt"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.9.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.4"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Admit runner and complete outer diagnostic preflights
        run: |
          runner_binary="$(readlink -f "/proc/$PPID/exe")"
          printf '%s\n' "$runner_binary" > "$RUNNER_TEMP/fallback-capture/evidence/runner-worker-path.txt"
          export CAPTURE_RUNNER_VERSION="$("$(dirname "$runner_binary")/Runner.Listener" --version)"
          deno run --allow-all --node-modules-dir=none --frozen scripts/fallback-capture-deno.ts preflight
          cp "$RUNNER_TEMP/fallback-capture/evidence/manifest.json" "$RUNNER_TEMP/fallback-capture/evidence/preflight-manifest.json"
          cp "$RUNNER_TEMP/fallback-capture/evidence/provenance.json" "$RUNNER_TEMP/fallback-capture/evidence/preflight-provenance.json"
      - name: Prepare exact product after successful outer preflight
        run: |
          runner_binary="$(readlink -f "/proc/$PPID/exe")"
          printf '%s\n' "$runner_binary" > "$RUNNER_TEMP/fallback-capture/evidence/runner-worker-prepare-path.txt"
          export CAPTURE_RUNNER_VERSION="$("$(dirname "$runner_binary")/Runner.Listener" --version)"
          deno run --allow-all --node-modules-dir=none --frozen scripts/fallback-capture-deno.ts prepare
          cp "$RUNNER_TEMP/fallback-capture/evidence/manifest.json" "$RUNNER_TEMP/fallback-capture/evidence/prepare-manifest.json"
          cp "$RUNNER_TEMP/fallback-capture/evidence/provenance.json" "$RUNNER_TEMP/fallback-capture/evidence/prepare-provenance.json"
      - name: Capture complete original consumer once after successful preparation
        timeout-minutes: 6
        run: deno run --allow-all --node-modules-dir=none --frozen scripts/fallback-capture-deno.ts consume
      - name: Retain partial evidence after every terminal outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fallback-capture-35749f4-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fallback-capture/evidence
          include-hidden-files: true
          if-no-files-found: error
