name: Incident 1518 hosted bench
on:
  push:
    branches: [verify/1518-hosted]
permissions:
  contents: read
jobs:
  repl-bench:
    name: REPL bench (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(github.event_name == 'push' && '["macos-latest","ubuntu-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: 4f0d6be4493b80df795616352b42b4ec9cec38cb
          path: repl bench checkout

      - name: Verify the exact source revision
        working-directory: repl bench checkout
        run: test "$(git rev-parse HEAD)" = 4f0d6be4493b80df795616352b42b4ec9cec38cb

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: repl bench checkout/package.json

      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.9.5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: github.event_name == 'push'
        with:
          bun-version: 1.4.0

      - name: Prepare the worktree
        working-directory: repl bench checkout
        run: deno task setup

      - name: Check REPL bench tools
        working-directory: repl bench checkout
        run: |
          deno test --reporter=dot --allow-all --cached-only --frozen --node-modules-dir=none \
            --ignore=examples/repl-bench/tests/driver-exit.test.ts,examples/repl-bench/tests/teardown.test.ts \
            examples/repl-bench/tests

      - name: Check XMD Profile tools
        working-directory: repl bench checkout
        run: |
          deno test --reporter=dot --allow-all --cached-only --frozen --node-modules-dir=none \
            examples/xmd-profile/tests

      - name: Exercise the REPL through a host terminal
        if: github.event_name == 'push'
        working-directory: repl bench checkout
        run: |
          deno test --reporter=dot --allow-all --cached-only --frozen --node-modules-dir=none \
            examples/repl-bench/tests/driver-exit.test.ts \
            examples/repl-bench/tests/teardown.test.ts
          echo "Running Markdown REPL Bench journeys"
          deno run --allow-all --cached-only --frozen --node-modules-dir=none \
            packages/cli/src/deno.ts test examples/repl-bench/journeys --reporter=failures

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name == 'push' && (failure() || cancelled())
        with:
          name: repl-bench-${{ matrix.host }}-attempt-${{ github.run_attempt }}
          path: |
            repl bench checkout/.bench/*/run.json
            repl bench checkout/.bench/*/screen.txt
            repl bench checkout/.bench/*/*.svg
            repl bench checkout/.bench/*/terminal.ansi
            repl bench checkout/.bench/*/closed.json
            repl bench checkout/.xmd/test-artifacts
          include-hidden-files: "true"
