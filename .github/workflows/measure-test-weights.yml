name: TODO flake diagnostic episode 1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: bounded wheel and paging diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIAGNOSTIC_DIRECTORY: ${{ runner.temp }}/todo-flake-diagnostic
      DIAGNOSTIC_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DIAGNOSTIC_ATTEMPT: ${{ github.run_attempt }}
      DIAGNOSTIC_COMMIT: ${{ github.sha }}
      DIAGNOSTIC_RUNNER: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.9.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.4"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Record exact diagnostic provenance
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, textwrap
          directory = pathlib.Path(os.environ["DIAGNOSTIC_DIRECTORY"])
          directory.mkdir(parents=True, exist_ok=False)
          def read(argv):
              return subprocess.check_output(argv, text=True).strip()
          base = "5d4f4fb97894f34b3f968bee4de827195efa6b74"
          versions = {name: read(command) for name, command in {
              "deno": ["deno", "--version"],
              "node": ["node", "--version"],
              "bun": ["bun", "--version"],
              "bunRevision": ["bun", "--revision"],
              "pnpm": ["pnpm", "--version"],
          }.items()}
          proof = {
              "base": base,
              "commit": read(["git", "rev-parse", "HEAD"]),
              "tree": read(["git", "rev-parse", "HEAD^{tree}"]),
              "parents": read(["git", "show", "-s", "--format=%P", "HEAD"]),
              "runUrl": os.environ["DIAGNOSTIC_RUN_URL"],
              "attempt": os.environ["DIAGNOSTIC_ATTEMPT"],
              "runner": os.environ["DIAGNOSTIC_RUNNER"],
              "runnerOS": pathlib.Path("/etc/os-release").read_text(),
              "uname": read(["uname", "-a"]),
              "versions": versions,
              "purpose": "One scratch diagnostic episode; no weights measurement or product source correction.",
          }
          patch = subprocess.check_output(["git", "diff", "--binary", base, "HEAD"])
          (directory / "base-to-diagnostic.patch").write_bytes(patch)
          proof["patchSHA256"] = hashlib.sha256(patch).hexdigest()
          (directory / "provenance.json").write_text(json.dumps(proof, indent=2) + "\n")
          print(json.dumps(proof, indent=2))
          assert proof["commit"] == os.environ["DIAGNOSTIC_COMMIT"], "Dispatched and checked-out commits differ"
          assert versions["deno"].splitlines()[0].startswith("deno 2.9.5 "), "Deno differs from approved pin"
          assert versions["node"] == "v22.23.4", "Node differs from approved pin"
          assert versions["bun"] == "1.4.0", "Bun differs from approved pin"
          wrapper = r'''
          import datetime, json, os, pathlib, subprocess, sys
          directory = pathlib.Path(os.environ["DIAGNOSTIC_DIRECTORY"])
          permission = "permission pages from a control-only window to its explanation and final choice"
          history = "History alone scrolls above a held question and restores its caret"
          file = "packages/cli/tests/repl-wheel-migration.test.ts"
          paging = "packages/cli/tests/repl-project-files.test.ts"
          commands = {
              "setup": [("setup", ["deno", "task", "setup"])],
              "selectors": [
                  ("node-permission", ["node", "node_modules/tsx/dist/cli.mjs", "--tsconfig", "tsconfig.node.json", "--test", "--test-concurrency=1", "--test-name-pattern", permission, file]),
                  ("bun-permission-history", ["bun", "test", "--timeout=300000", "-t", permission + "|" + history, file]),
                  ("deno-project-files", ["deno", "task", "test", paging]),
                  ("node-project-files", ["pnpm", "exec", "tsx", "--tsconfig", "tsconfig.node.json", "--test", "--test-concurrency=1", paging]),
              ],
          }
          for name, argv in commands[sys.argv[1]]:
              receipt = {"name": name, "argv": argv, "cwd": os.getcwd(), "status": "running", "startedAt": datetime.datetime.now(datetime.timezone.utc).isoformat()}
              target = directory / (name + ".json")
              if target.exists():
                  raise RuntimeError("This selector already has a receipt; do not repeat it")
              target.write_text(json.dumps(receipt, indent=2) + "\n")
              print(json.dumps({"diagnosticLaunch": receipt}), flush=True)
              with (directory / (name + ".log")).open("wb") as output:
                  process = subprocess.Popen(argv, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  while True:
                      chunk = process.stdout.read1(65536)
                      if not chunk:
                          break
                      output.write(chunk)
                      output.flush()
                      sys.stdout.buffer.write(chunk)
                      sys.stdout.buffer.flush()
                  code = process.wait()
              receipt.update({"status": "completed", "exitCode": code, "completedAt": datetime.datetime.now(datetime.timezone.utc).isoformat()})
              target.write_text(json.dumps(receipt, indent=2) + "\n")
              if code:
                  print(json.dumps({"firstFailure": name, "remainingSelectors": "not launched"}), flush=True)
                  sys.exit(code if code > 0 else 128 - code)
          '''
          (directory / "run.py").write_text(textwrap.dedent(wrapper).lstrip())
          PY

      - name: Prepare the checkout once
        run: python3 "$DIAGNOSTIC_DIRECTORY/run.py" setup

      - name: Run each approved selector once and stop at first failure
        run: python3 "$DIAGNOSTIC_DIRECTORY/run.py" selectors

      - name: Retain checkout state after execution
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          directory = pathlib.Path(os.environ["DIAGNOSTIC_DIRECTORY"])
          directory.mkdir(parents=True, exist_ok=True)
          status = subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=no"], text=True)
          patch = subprocess.check_output(["git", "diff", "--binary", "HEAD"])
          (directory / "after-execution.patch").write_bytes(patch)
          hashes = {file.name: hashlib.sha256(file.read_bytes()).hexdigest() for file in directory.iterdir() if file.is_file()}
          report = {"trackedStatus": status, "trackedUnchanged": not status, "hashes": hashes}
          (directory / "after-execution.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          assert not status, "Diagnostic execution modified tracked checkout state"
          PY

      - name: Upload complete first outputs and trace
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: todo-flake-diagnostic-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/todo-flake-diagnostic
          if-no-files-found: warn
