name: Bounded 1143 Bun shard trace
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.9.5
      - name: Prepare the exact failed CI source
        run: |
          git worktree add --detach "$RUNNER_TEMP/bun9-source" 345c53ec81645eed8025592cd79b4a3d19d9115f
          cd "$RUNNER_TEMP/bun9-source"
          deno task deps
          bun install
      - name: Capture one original Bun shard
        run: python3 .diagnostic-1143/bun-shard.py "$RUNNER_TEMP/bun9-source" "$RUNNER_TEMP/bun9-trace"
      - name: Preserve the shard outcome and attribution
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: 1143-bun9-trace-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bun9-trace
          if-no-files-found: error
          retention-days: 7
