name: Bounded 1143 Deno shard trace
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      XMD_TEST_ARTIFACTS: ${{ github.workspace }}/.xmd/test-artifacts
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Stage the collector outside the source checkout
        run: cp -R .diagnostic-1143 "$RUNNER_TEMP/deno20-payload"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 3a85da1998554fb75ae22fc942269b6ede23c44b
          persist-credentials: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.9.5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: deno task deps
      - name: Build the browser bundle
        run: deno task build:web
      - name: Typecheck
        run: deno task check
      - name: Publish workflow is generated from manifests
        run: |
          deno task gen:publish-workflow
          git diff --exit-code .github/workflows/publish-packages.yml \
            || { echo "::error::publish-packages.yml is out of date — run 'deno task gen:publish-workflow' and commit the result"; exit 1; }
      - name: Capture one original Deno shard
        run: python3 "$RUNNER_TEMP/deno20-payload/deno-shard.py" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/deno20-trace"
      - name: Preserve the shard outcome and attribution
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: 1143-deno20-trace-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deno20-trace
          if-no-files-found: error
          retention-days: "7"
      - name: Upload failed test journals
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-journals-deno-20-attempt-${{ github.run_attempt }}
          path: ${{ env.XMD_TEST_ARTIFACTS }}
          if-no-files-found: ignore
          retention-days: "7"
