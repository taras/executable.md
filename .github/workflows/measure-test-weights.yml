{
  "name": "Diagnose XL3 Main health 1154",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "diagnostic": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "defaults": {
        "run": {
          "working-directory": "source"
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10",
          "with": {
            "ref": "2d12c47ce7970ccbf511b995e60787e5e6993fdc",
            "path": "source"
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "22.23.4"
          }
        },
        {
          "uses": "denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb",
          "with": {
            "deno-version": "v2.9.5"
          }
        },
        {
          "uses": "pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1",
          "with": {
            "package_json_file": "source/package.json"
          }
        },
        {
          "name": "Prepare isolated frozen subject",
          "run": "deno task setup"
        },
        {
          "name": "Observe the original XL3 boundary once",
          "run": "python3 - <<'PY'\n\nimport pathlib,subprocess,json,hashlib,os,time,signal,difflib\ns=pathlib.Path.cwd();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'xl3-1154-diagnostic';out.mkdir(exist_ok=False)\nhead=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();assert head=='2d12c47ce7970ccbf511b995e60787e5e6993fdc'\nversions={name:subprocess.check_output([name,'--version'],text=True).strip() for name in ['node','deno','pnpm','git']}\nassert versions['node']=='v22.23.4'\nassert subprocess.check_output(['node','-p','process.platform+\"/\"+process.arch'],text=True).strip()=='linux/x64'\nassert subprocess.check_output(['git','status','--porcelain'],text=True)==''\noriginal=(s/'packages/test-agent/tests/command-lazy.test.ts').read_text()\nassert hashlib.sha256(original.encode()).hexdigest()=='18ee8ee2f017c480ab2bc30909385cbf7dae997ef0a8bd90bf723aa3e35dc0c1'\ncandidate=original.replace('from \"../src/components.ts\";','from '+json.dumps(str(s/'packages/test-agent/src/components.ts'))+';')\nneedle='      return { results: yield* testing.results };';assert candidate.count(needle)==1\nreplacement='\\n'.join([\n'      const outcome = yield* execution;',\n'      const results = yield* testing.results;',\n'      console.error(\"XL3_DIAGNOSTIC\", JSON.stringify({',\n'        output: next.value,',\n'        results,',\n'        asked: asked.calls,',\n'        execution: outcome.ok ? { ok: true } : {',\n'          ok: false, name: outcome.error.name, message: outcome.error.message,',\n'        },',\n'      }));',\n'      return { results };'])\ncandidate=candidate.replace(needle,replacement);assert candidate!=original\ncase=out/'xl3-diagnostic.test.ts';case.write_text(candidate)\n(out/'package.json').write_text('{\"type\":\"module\"}\\n');(out/'node_modules').symlink_to(s/'node_modules',target_is_directory=True)\n(out/'candidate.diff').write_text(''.join(difflib.unified_diff(original.splitlines(True),candidate.splitlines(True),fromfile='exact-subject/command-lazy.test.ts',tofile='artifact-only/xl3-diagnostic.test.ts')))\nargv=['node',str(s/'node_modules/tsx/dist/cli.mjs'),'--tsconfig',str(s/'tsconfig.node.json'),'--test','--test-concurrency=1',str(case)]\nmeta={'subject':head,'runtime':versions,'platform':'linux/x64','argv':argv,'originalSha256':hashlib.sha256(original.encode()).hexdigest(),'candidateSha256':hashlib.sha256(candidate.encode()).hexdigest(),'diagnosticOnly':True,'noModelCalls':True,'originalAssertionsAndDeadlinesUnchanged':True,'executionCapSeconds':120}\n(out/'candidate.json').write_text(json.dumps(meta,indent=2)+'\\n')\nstart=time.monotonic();timedout=False\nwith (out/'first-output.log').open('wb') as log:\n child=subprocess.Popen(argv,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\n try: code=child.wait(timeout=120)\n except subprocess.TimeoutExpired:\n  timedout=True;os.killpg(child.pid,signal.SIGTERM)\n  try: code=child.wait(timeout=5)\n  except subprocess.TimeoutExpired: os.killpg(child.pid,signal.SIGKILL);code=child.wait()\nclean=subprocess.check_output(['git','status','--porcelain'],text=True)==''\nreceipt={**meta,'exit':code,'elapsedSeconds':time.monotonic()-start,'timedOut':timedout,'joined':True,'sourceClean':clean,'firstOutputSha256':hashlib.sha256((out/'first-output.log').read_bytes()).hexdigest()}\n(out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\\n');print(json.dumps(receipt),flush=True)\nraise SystemExit(0 if code==0 and clean and not timedout else 1)\n\nPY"
        },
        {
          "name": "Preserve first diagnostic evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "xl3-1154-first-diagnostic",
            "path": "${{ runner.temp }}/xl3-1154-diagnostic",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
