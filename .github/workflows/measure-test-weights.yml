name: Probe Node compile cache for the intact Sidekick Journal witness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 0c6b488f4af7dea23953a38181b127d72d9e7cac
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.9.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.4"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Prepare the pinned target source
        run: deno task setup
      - name: Run the whole file once with an empty invocation-owned child compile cache
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,json,os,time,signal,hashlib,resource,re
          s=pathlib.Path.cwd();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'node-journal-cache-probe';out.mkdir(exist_ok=False)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();assert head=='0c6b488f4af7dea23953a38181b127d72d9e7cac'
          assert subprocess.check_output(['git','status','--porcelain'],text=True)==''
          source=s/'packages/cli/tests/repl-sidekick-acp.test.ts';original=source.read_bytes();(out/'original-test.ts').write_bytes(original)
          text=original.decode();start=text.index('  it("1077 J1-J5:');end=text.index('    function* componentPage',start)
          part=text[start:end];needle='            DENO_DIR: process.env.DENO_DIR ?? "",';assert part.count(needle)==1
          part=part.replace(needle,needle+'\n            NODE_COMPILE_CACHE: join(one.home, "node-compile-cache"),');source.write_text(text[:start]+part+text[end:])
          patch=subprocess.check_output(['git','diff','--',str(source)],text=False);(out/'diagnostic.patch').write_bytes(patch)
          versions={name:subprocess.check_output([name,'--version'],text=True).strip() for name in ['node','deno','bun','git']}
          assert versions['node']=='v22.23.4'
          launcher=s/'node_modules/.bin/tsx';(out/'prepared-launcher.txt').write_bytes(launcher.read_bytes())
          resolution=subprocess.check_output(['node','--input-type=module','-e',"import {createRequire} from 'node:module';import fs from 'node:fs';const r=createRequire(process.cwd()+'/packages/test-support/launch.ts');const cli=r.resolve('tsx/cli');const pkg=r.resolve('tsx/package.json');console.log(JSON.stringify({cli,package:pkg,version:JSON.parse(fs.readFileSync(pkg,'utf8')).version}));"],text=True).strip()
          argv=[str(launcher),'--tsconfig','tsconfig.node.json','--test','--test-concurrency=1','packages/cli/tests/repl-sidekick-acp.test.ts']
          provenance={'revision':head,'diagnosticOnly':True,'sourcePatchSha256':hashlib.sha256(patch).hexdigest(),'originalTestSha256':hashlib.sha256(original).hexdigest(),'patchedTestSha256':hashlib.sha256(source.read_bytes()).hexdigest(),'versions':versions,'preparedLauncher':str(launcher),'launcherResolved':str(launcher.resolve()),'launcherSha256':hashlib.sha256(launcher.read_bytes()).hexdigest(),'nestedTsx':json.loads(resolution),'argv':argv,'scope':'One added env binding in J1-J5 CLI command; fresh cache under invocation-owned temporary home; no warmup, no name filter, all assertions and both same-owner walks unchanged','parentNodeCompileCacheRemoved':True,'diagnosticParentCapSeconds':1100}
          (out/'provenance.json').write_text(json.dumps(provenance,indent=2)+'\n');print(json.dumps(provenance),flush=True)
          env=dict(os.environ);env.pop('NODE_COMPILE_CACHE',None);env.pop('NODE_DISABLE_COMPILE_CACHE',None)
          start=time.monotonic();before=resource.getrusage(resource.RUSAGE_CHILDREN);timedout=False
          log=out/'complete-first-output.log'
          with log.open('wb') as stream:
           child=subprocess.Popen(argv,env=env,stdin=subprocess.PIPE,stdout=stream,stderr=subprocess.STDOUT,start_new_session=True)
           try:
            try:code=child.wait(timeout=1100)
            except subprocess.TimeoutExpired:
             timedout=True;os.killpg(child.pid,signal.SIGTERM)
             try:code=child.wait(timeout=5)
             except subprocess.TimeoutExpired:os.killpg(child.pid,signal.SIGKILL);code=child.wait()
           finally:
            if child.stdin:child.stdin.close()
          after=resource.getrusage(resource.RUSAGE_CHILDREN);output=log.read_text(errors='replace');homes=[]
          for line in output.splitlines():
           marker=line.find('{"kind":"attachment-client-inputs"')
           if marker>=0:
            try:
             home=json.loads(line[marker:])['home'];homes.append({'home':home,'existsAfterJoinedFile':pathlib.Path(home).exists(),'cacheExistsAfterJoinedFile':(pathlib.Path(home)/'node-compile-cache').exists()})
            except (ValueError,KeyError):pass
          samePatch=subprocess.check_output(['git','diff','--',str(source)])==patch
          receipt={**provenance,'elapsedSeconds':time.monotonic()-start,'userCpuSeconds':after.ru_utime-before.ru_utime,'systemCpuSeconds':after.ru_stime-before.ru_stime,'exit':code,'timedOut':timedout,'joined':True,'sourcePatchUnchanged':samePatch,'outputSha256':hashlib.sha256(log.read_bytes()).hexdigest(),'fixtureHomes':homes,'cacheCleanupVerified':bool(homes) and all(not x['existsAfterJoinedFile'] and not x['cacheExistsAfterJoinedFile'] for x in homes),'pageCountLines':[x for x in output.splitlines() if 'channel-walk' in x or 'originalBytes' in x],'durationLines':[x for x in output.splitlines() if '1077 J1-J5' in x or re.search(r'^\s*#?\s*duration_ms:',x)]}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n');print(json.dumps({k:receipt[k] for k in ['elapsedSeconds','exit','timedOut','joined','sourcePatchUnchanged','cacheCleanupVerified','pageCountLines']}),flush=True)
          raise SystemExit(0 if code==0 and not timedout and samePatch and receipt['cacheCleanupVerified'] else 1)
          PY
      - name: Preserve complete first probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: node-journal-cache-probe
          path: ${{ runner.temp }}/node-journal-cache-probe
          if-no-files-found: error
