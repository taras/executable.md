name: Qualify both intact Sidekick test files on Node
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 0c6b488f4af7dea23953a38181b127d72d9e7cac
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.9.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.4"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Prepare the pinned target source
        run: deno task setup
      - name: Qualify both full files serially with fresh invocation-owned state
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,json,os,time,signal,hashlib,resource,re,base64
          s=pathlib.Path.cwd();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'node-journal-extraction-focused';out.mkdir(exist_ok=False)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();assert head=='0c6b488f4af7dea23953a38181b127d72d9e7cac';assert subprocess.check_output(['git','status','--porcelain'],text=True)==''
          patch=base64.b64decode('');assert hashlib.sha256(patch).hexdigest()=='7a56b51d7ace601fa0ff139b7e784e667442b581eca87830796a454683b7bd4e';(out/'candidate.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','-'],input=patch,check=True);subprocess.run(['git','apply','-'],input=patch,check=True)
          versions={name:subprocess.check_output([name,'--version'],text=True).strip() for name in ['node','deno','bun','git']};assert versions['node']=='v22.23.4'
          launcher=s/'node_modules/.bin/tsx';(out/'prepared-launcher.txt').write_bytes(launcher.read_bytes())
          resolution=json.loads(subprocess.check_output(['node','--input-type=module','-e',"import {createRequire} from 'node:module';import fs from 'node:fs';const r=createRequire(process.cwd()+'/packages/test-support/launch.ts');const cli=r.resolve('tsx/cli');const pkg=r.resolve('tsx/package.json');console.log(JSON.stringify({cli,package:pkg,version:JSON.parse(fs.readFileSync(pkg,'utf8')).version}));"],text=True))
          paths=['packages/cli/tests/repl-sidekick-journal-cli.test.ts','packages/cli/tests/repl-sidekick-acp.test.ts','packages/cli/tests/support/sidekick-attachment.ts'];sourceHashes={path:hashlib.sha256((s/path).read_bytes()).hexdigest() for path in paths}
          provenance={'baseline':head,'patchSha256':hashlib.sha256(patch).hexdigest(),'versions':versions,'preparedLauncher':str(launcher),'launcherResolved':str(launcher.resolve()),'launcherSha256':hashlib.sha256(launcher.read_bytes()).hexdigest(),'nestedTsx':resolution,'sourceHashes':sourceHashes,'wholeFilesOnceEach':True,'initialCache':'Fresh test-owned temporary home, no warmup or previous-invocation cache','parentCapSecondsPerFile':600,'fileQualificationTargetMs':420000,'diagnosticHookOnly':True};(out/'provenance.json').write_text(json.dumps(provenance,indent=2)+'\n');print(json.dumps(provenance),flush=True)
          env=dict(os.environ);env.pop('NODE_COMPILE_CACHE',None);env.pop('NODE_DISABLE_COMPILE_CACHE',None);rows=[]
          for path in paths[:2]:
           case=out/pathlib.Path(path).stem;case.mkdir();argv=[str(launcher),'--tsconfig','tsconfig.node.json','--test','--test-concurrency=1',path];start=time.monotonic();before=resource.getrusage(resource.RUSAGE_CHILDREN);timedout=False;log=case/'complete-first-output.log'
           with log.open('wb') as stream:
            child=subprocess.Popen(argv,env=env,stdin=subprocess.PIPE,stdout=stream,stderr=subprocess.STDOUT,start_new_session=True)
            try:
             try:code=child.wait(timeout=600)
             except subprocess.TimeoutExpired:
              timedout=True;os.killpg(child.pid,signal.SIGTERM)
              try:code=child.wait(timeout=5)
              except subprocess.TimeoutExpired:os.killpg(child.pid,signal.SIGKILL);code=child.wait()
            finally:
             if child.stdin:child.stdin.close()
           elapsed=time.monotonic()-start;after=resource.getrusage(resource.RUSAGE_CHILDREN);output=log.read_text(errors='replace');homes=[];pages=[]
           for line in output.splitlines():
            i=line.find('{"kind":"attachment-client-inputs"')
            if i>=0:
             home=json.loads(line[i:])['home'];homes.append({'home':home,'existsAfterJoin':pathlib.Path(home).exists(),'cacheExistsAfterJoin':(pathlib.Path(home)/'node-compile-cache').exists()})
            i=line.find('{"kind":"1077-cli-channel-walk"')
            if i>=0:pages.append(json.loads(line[i:]))
           caseTime=re.search(r'\bok \d+ - 1077 J1-J5:[^\n]*\n\s*---\n\s*duration_ms: ([0-9.]+)',output);fileTime=re.findall(r'^# duration_ms ([0-9.]+)',output,re.M)
           row={'file':path,'argv':argv,'exit':code,'joined':True,'timedOut':timedout,'elapsedSeconds':elapsed,'userCpuSeconds':after.ru_utime-before.ru_utime,'systemCpuSeconds':after.ru_stime-before.ru_stime,'tapFileMs':float(fileTime[-1]) if fileTime else None,'intactCaseMs':float(caseTime.group(1)) if caseTime else None,'outputSha256':hashlib.sha256(log.read_bytes()).hexdigest(),'homes':homes,'cleanupVerified':bool(homes) and all(not x['existsAfterJoin'] and not x['cacheExistsAfterJoin'] for x in homes),'pageCounts':pages,'targetMet':code==0 and not timedout and elapsed<420};rows.append(row);(case/'receipt.json').write_text(json.dumps(row,indent=2)+'\n');print(json.dumps({k:row[k] for k in ['file','exit','joined','timedOut','elapsedSeconds','tapFileMs','intactCaseMs','cleanupVerified','targetMet','pageCounts']}),flush=True)
          unchanged=all(hashlib.sha256((s/path).read_bytes()).hexdigest()==sourceHashes[path] for path in paths)
          receipt={**provenance,'rows':rows,'candidateFilesUnchangedAfterTests':unchanged,'allFocusedPass':unchanged and all(x['targetMet'] and x['cleanupVerified'] for x in rows)};(out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n');raise SystemExit(0 if receipt['allFocusedPass'] else 1)
          PY
      - name: Preserve first complete qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: node-journal-extraction-focused
          path: ${{ runner.temp }}/node-journal-extraction-focused
          if-no-files-found: error
