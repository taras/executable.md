name: Bounded 1143 diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.9.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.4"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Prepare both exact sources before either observation
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/b1143" 321eac2a07e01ca14830c275117b4e94e26bd4c9
          git worktree add --detach "$RUNNER_TEMP/c1143" a40e68b903e7a322395cd2d7130657397ccf4c92
          (cd "$RUNNER_TEMP/b1143" && deno task setup)
          (cd "$RUNNER_TEMP/c1143" && deno task setup)
      - name: One matched Node carrier pair
        shell: bash
        run: |
          set -euo pipefail
          python3 .diagnostic-1143/payload.py pair --baseline "$RUNNER_TEMP/b1143" --corrected "$RUNNER_TEMP/c1143" --output "$RUNNER_TEMP/diagnostic-1143"
      - name: Preserve first outcomes, even when a carrier fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bounded-1143-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diagnostic-1143
          if-no-files-found: error
