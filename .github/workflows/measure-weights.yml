# Timing weights for shard balancing, measured where CI runs.
#
# A developer machine measures a different corpus cost than a runner does, and
# shards balanced on the wrong hardware are balanced on nothing. This runs the
# same `deno task weights:measure` on `ubuntu-latest`, on demand, and uploads
# the result for a human to review and commit. Nothing here writes to the
# repository: recorded weights are a reviewed change, not a build side effect.
name: Measure test weights

on:
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.9.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Prepare both dependency layouts
        run: deno task setup

      - name: Measure every test file under every runtime
        run: deno task weights:measure --label ubuntu-latest

      - name: Upload the measured weights
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-weights
          path: test-weights.json
