name: Preparation profile

on:
  push:
    branches: [codex/ci-preparation-timeout-1117]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.9.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Prepare this checkout once
        run: deno task setup

      - name: Capture the one Node Preparation execution
        id: capture
        shell: bash
        run: |
          set -uo pipefail
          capture_directory=$(mktemp -d "$RUNNER_TEMP/preparation-profile.XXXXXX")
          export CAPTURE_DIRECTORY="$capture_directory"
          printf 'directory=%s\n' "$capture_directory" >> "$GITHUB_OUTPUT"
          printf 'unknown\n' > "$capture_directory/exit-status.txt"
          python3 - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path

          def output(*argv):
              return subprocess.check_output(argv, text=True).strip()

          metadata = {
              "sha": output("git", "rev-parse", "HEAD"),
              "tree": output("git", "rev-parse", "HEAD^{tree}"),
              "cwd": os.getcwd(),
              "argv": ["pnpm", "exec", "tsx", "--tsconfig", "tsconfig.node.json",
                       "--test", "--test-concurrency=1",
                       "packages/cli/tests/adversarial-preparation.test.ts"],
              "runUrl": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "versions": {name: output(name, "--version") for name in ["deno", "node", "bun", "pnpm"]},
              "os": platform.platform(),
              "architecture": platform.machine(),
              "runner": {key: os.environ.get(key) for key in ["RUNNER_OS", "RUNNER_ARCH", "RUNNER_NAME", "ImageOS", "ImageVersion"]},
              "osRelease": Path("/etc/os-release").read_text(),
          }
          Path(os.environ["CAPTURE_DIRECTORY"], "metadata.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
          metadata_status=$?
          if [ "$metadata_status" -ne 0 ]; then
            exit "$metadata_status"
          fi
          pnpm exec tsx --tsconfig tsconfig.node.json --test --test-concurrency=1 packages/cli/tests/adversarial-preparation.test.ts \
            > "$capture_directory/stdout.log" 2> "$capture_directory/stderr.log" &
          capture_pid=$!
          printf '%s\n' "$capture_pid" > "$capture_directory/child-pid.txt"
          wait "$capture_pid"
          capture_status=$?
          printf '%s\n' "$capture_status" > "$capture_directory/exit-status.txt"
          exit "$capture_status"

      - name: Index the original capture
        if: ${{ always() && steps.capture.outputs.directory != '' }}
        shell: bash
        env:
          CAPTURE_DIRECTORY: ${{ steps.capture.outputs.directory }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          directory = Path(os.environ["CAPTURE_DIRECTORY"])
          files = [{"path": path.name, "bytes": path.stat().st_size,
                    "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
                   for path in sorted(directory.iterdir()) if path.is_file()]
          (directory / "index.json").write_text(json.dumps({"files": files}, indent=2) + "\n")
          PY

      - name: Upload the first capture
        if: ${{ always() && steps.capture.outputs.directory != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preparation-profile-attempt-${{ github.run_attempt }}
          path: ${{ steps.capture.outputs.directory }}
          if-no-files-found: error
          retention-days: "7"
