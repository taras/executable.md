name: 1158 one-shot Bun diagnostic

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact failing source revision
        required: true
        default: bd85a00406f245adffda5b296d4dc8163347cacd
      report_name:
        description: Artifact prefix
        required: false
        default: main-1158-first-capture

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: diagnostic-kit
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.ref }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.4"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: source/package.json
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.9.5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Prepare exact failing source
        working-directory: source
        run: deno task setup
      - name: Run original workload once with private progress capture
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/diagnostic-kit/.diagnostics/1158/hosted-capture.py"             --source "$GITHUB_WORKSPACE/source"             --output "$RUNNER_TEMP/main-1158-first"             --bun "$(command -v bun)" --deno "$(command -v deno)"
      - name: Preserve complete first evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.report_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/main-1158-first
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
