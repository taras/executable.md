name: Friction Linux diagnostic (one run)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact historical source checked out by the failed job
        required: true
        default: f5538fa5c1c63e95cb05b624a12d4cfb6846d006
      report_name:
        description: Compatibility label; diagnostic artifact name is fixed
        required: false
        default: friction-linux-once

permissions:
  contents: read

jobs:
  friction-diagnostic:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Confirm the approved ref and immutable source
        env:
          REQUESTED_SOURCE: ${{ inputs.ref }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/friction-linux-diagnostic-1119-20261105
          test "$REQUESTED_SOURCE" = f5538fa5c1c63e95cb05b624a12d4cfb6846d006
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: carrier
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: f5538fa5c1c63e95cb05b624a12d4cfb6846d006
          path: source
          persist-credentials: false
      - name: Stage approved diagnostic files
        run: |
          mkdir -p probe result/timing
          cp carrier/.diagnostics/friction-linux/probe/* probe/
          python3 probe/environment.py image-before-toolchain
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.9.5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Record selected runtime versions
        run: |
          python3 probe/environment.py selected-toolchain
          deno --version | head -1 | grep -F 'deno 2.9.5 '
          test "$(bun --version)" = 1.4.0
      - name: Historical Typecheck prelude
        working-directory: source
        run: deno task check
      - name: Historical generated-workflow prelude
        working-directory: source
        run: |
          deno task gen:publish-workflow
          git diff --exit-code .github/workflows/publish-packages.yml
      - name: Historical dependency prelude
        working-directory: source
        run: deno task deps
      - name: Historical browser build prelude
        working-directory: source
        run: deno task build:web
      - name: Prior shard file warmup
        working-directory: source
        run: deno test --allow-all --frozen packages/acp/tests/permission-bridge.test.ts
      - name: Prior Workflow warmup with its existing 120s limit
        timeout-minutes: 3
        run: python3 probe/run-once.py Workflow
      - name: Validate the observation hooks once
        timeout-minutes: 1
        run: python3 probe/run-once.py Sanity
      - name: One timed Friction run with its existing 120s limit
        timeout-minutes: 4
        run: |
          python3 probe/environment.py before-friction
          python3 probe/run-once.py Friction
      - name: Preserve the actual result and partial observations
        if: always()
        run: |
          if test -f probe/environment.py; then python3 probe/environment.py final-environment; fi
          if test -f probe/summarize.py; then python3 probe/summarize.py; fi
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: friction-linux-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: result
          if-no-files-found: warn
          retention-days: 30
