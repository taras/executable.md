name: Repo Analysis

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to analyze
        required: true
        default: main
      report_name:
        description: Optional report label prefix
        required: false
        default: repo-analysis

concurrency:
  group: repo-analysis-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.9.5

      - name: Install dependencies
        run: deno task deps

      - name: Build the checked-out xmd binary
        run: deno task build

      - name: Run repo analysis
        env:
          DEEPINFRA_TOKEN: ${{ secrets.DEEPINFRA_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./dist/xmd run .reviews/AnalyzeRepoCI.md \
            --component-dir .reviews/components \
            --component-dir .reviews/policies \
            --component-dir packages/core/components \
            -j .reviews/journal.analyze.ci.jsonl > .reviews/analyze-report.md

      - name: Verify analysis result
        if: always()
        run: |
          test -x .reviews/.oxlint/oxlint && test -x .reviews/.oxlint/tsgolint \
            || { echo "::error::oxlint/tsgolint could not be provisioned by EnsureOxlint"; exit 1; }
          test -f .reviews/journal.analyze.ci.jsonl \
            || { echo "::error::xmd did not produce an analysis journal"; exit 1; }
          ROOT_CLOSE=$(jq -c 'select(.type == "close" and .coroutineId == "root")' .reviews/journal.analyze.ci.jsonl | tail -n 1)
          test -n "$ROOT_CLOSE" \
            || { echo "::error::xmd did not close the analysis root document"; exit 1; }
          ROOT_STATUS=$(printf '%s' "$ROOT_CLOSE" | jq -r '.result.status // "missing"')
          test "$ROOT_STATUS" = ok \
            || { echo "::error::xmd analysis root close was unsuccessful: $ROOT_STATUS"; exit 1; }
          VALUE_STATUS=$(printf '%s' "$ROOT_CLOSE" | jq -r '.result.value.status // "ok"')
          test "$VALUE_STATUS" = ok \
            || { echo "::error::xmd analysis root output was unsuccessful: $VALUE_STATUS"; exit 1; }
          ROOT_OUTPUT=$(printf '%s' "$ROOT_CLOSE" | jq -r '.result.value.output? // .result.value.value? // .result.value? // "" | tostring')
          if [[ "$ROOT_OUTPUT" == *'<!-- ERROR:'* ]]; then
            echo "::error::xmd rendered an analysis document error"
            exit 1
          fi

      - name: Write run metadata
        if: always()
        run: |
          mkdir -p .reviews
          cat > .reviews/analyze-run.json <<'JSON'
          {
            "workflow": "repo-analysis.yml",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "run_attempt": "${{ github.run_attempt }}",
            "sha": "${{ github.sha }}",
            "ref": "${{ inputs.ref }}",
            "report_name": "${{ inputs.report_name }}"
          }
          JSON

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.report_name }}-${{ github.sha }}
          path: |
            .reviews/analyze-report.md
            .reviews/journal.analyze.ci.jsonl
            .reviews/analyze-run.json
          retention-days: 30
