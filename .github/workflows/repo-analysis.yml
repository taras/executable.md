name: 1158 CI Bun layout capture

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact failing source revision
        required: true
        default: bd85a00406f245adffda5b296d4dc8163347cacd
      report_name:
        description: Artifact prefix
        required: false
        default: main-1158-ci-layout

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: diagnostic-kit
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.ref }}
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.9.5
      - name: Reconstruct committed Bun preparation and run three-file prefix once
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/diagnostic-kit/.diagnostics/1158/ci-layout-capture.py" --source "$GITHUB_WORKSPACE/source" --output "$RUNNER_TEMP/main-1158-ci-layout" --bun "$(command -v bun)" --deno "$(command -v deno)"
      - name: Preserve complete first evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.report_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/main-1158-ci-layout
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
