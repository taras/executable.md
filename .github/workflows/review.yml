name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.9.5

      - name: Install dependencies
        run: deno task deps

      - name: Build the checked-out xmd binary
        run: deno task build

      - name: Run review
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEEPINFRA_TOKEN: ${{ secrets.DEEPINFRA_TOKEN }}
        run: |
          ./dist/xmd run .reviews/ReviewPR.md \
            --component-dir .reviews/components \
            --component-dir .reviews/policies \
            --component-dir packages/core/components \
            -j .reviews/journal.jsonl \
            --verbose

      - name: Verify review result
        if: always()
        run: |
          test -x .reviews/.oxlint/oxlint && test -x .reviews/.oxlint/tsgolint \
            || { echo "::error::oxlint/tsgolint could not be provisioned by EnsureOxlint"; exit 1; }
          test -f .reviews/journal.jsonl \
            || { echo "::error::xmd did not produce a journal"; exit 1; }
          ROOT_CLOSE=$(jq -c 'select(.type == "close" and .coroutineId == "root")' .reviews/journal.jsonl | tail -n 1)
          test -n "$ROOT_CLOSE" \
            || { echo "::error::xmd did not close the root document"; exit 1; }
          ROOT_STATUS=$(printf '%s' "$ROOT_CLOSE" | jq -r '.result.status // "missing"')
          test "$ROOT_STATUS" = ok \
            || { echo "::error::xmd root close was unsuccessful: $ROOT_STATUS"; exit 1; }
          VALUE_STATUS=$(printf '%s' "$ROOT_CLOSE" | jq -r '.result.value.status // "ok"')
          test "$VALUE_STATUS" = ok \
            || { echo "::error::xmd root output was unsuccessful: $VALUE_STATUS"; exit 1; }
          ROOT_OUTPUT=$(printf '%s' "$ROOT_CLOSE" | jq -r '.result.value.output? // .result.value.value? // .result.value? // "" | tostring')
          if [[ "$ROOT_OUTPUT" == *'<!-- ERROR:'* ]]; then
            echo "::error::xmd rendered a document error"
            exit 1
          fi

      - name: Upload journal
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-journal-${{ github.event.pull_request.head.sha }}
          path: .reviews/journal.jsonl
          retention-days: 30
