name: TestAgent Linux timing

on:
  push:
    branches: [codex/test-agent-linux-timing-1146]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.4"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.9.5
      - name: Prepare the recorded source revisions
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/test-agent-timing"
          mkdir -p "$root"
          {
            git rev-parse HEAD
            uname -a
            node --version
            pnpm --version
            deno --version
            printenv ImageOS ImageVersion || true
          } > "$root/runner.txt"
          for variant in baseline candidate; do
            git worktree add --detach "$RUNNER_TEMP/timing-$variant" "$(cat "scripts/diagnostics/$variant.revision")"
            (
              cd "$RUNNER_TEMP/timing-$variant"
              git rev-parse HEAD
              deno task deps
              deno task build:web
              pnpm install
              pnpm exec tsc --project tsconfig.node.json --noEmit
            ) 2>&1 | tee "$root/$variant-setup.log"
          done
      - name: Compare the historical Node test on this runner
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/test-agent-timing"
          failures=0
          for variant in baseline candidate; do
            bash -euo pipefail -s -- "$variant" "$root" <<'COMPARE' || failures=1
          variant="$1"
          root="$2"
          cd "$RUNNER_TEMP/timing-$variant"
          python3 "$GITHUB_WORKSPACE/scripts/diagnostics/test-agent-linux-overlay.py"
          git diff --binary > "$root/$variant-overlay.patch"
          {
            git rev-parse HEAD
            git hash-object packages/acp/src/provider.ts
            git hash-object packages/test-agent/tests/session-configuration.test.ts
            git hash-object packages/test-agent/src/SessionConfiguration.test.md
            git hash-object packages/test-agent/src/SessionConfiguration.review.md
            printf '%s\n' 'pnpm exec tsx --tsconfig tsconfig.node.json --test --test-concurrency=1 packages/test-agent/tests/session-configuration.test.ts'
          } > "$root/$variant-source.txt"
          export XMD_TEST_ARTIFACTS="$root/$variant-journals"
          status=0
          pnpm exec tsx --tsconfig tsconfig.node.json --test --test-concurrency=1 packages/test-agent/tests/session-configuration.test.ts > "$root/$variant-first.log" 2>&1 || status=$?
          echo "$status" > "$root/$variant-status.txt"
          sed -n 's/^# XMD_TIMING //p' "$root/$variant-first.log" > "$root/$variant-events.jsonl"
          tail -20 "$root/$variant-first.log"
          COMPARE
          done
          exit "$failures"
      - name: Retain comparison and first output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-agent-linux-timing-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-agent-timing
          if-no-files-found: error
          retention-days: "7"
